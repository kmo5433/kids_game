<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>अक्षर दोस्त · ABCD मिलाओ</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#294b45;font-family:system-ui,'Nirmala UI',sans-serif}header{max-width:1000px;margin:auto;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:24px;font-weight:900}.brand span{background:#ffd874;padding:5px 10px;border-radius:13px}nav{display:flex;gap:16px}a{color:#527368;font-size:14px}main{max-width:900px;margin:auto;padding:0 18px}h1{text-align:center;font-size:clamp(28px,5vw,42px);margin:12px 0}main>p{text-align:center;color:#6a796c;line-height:1.7}.playground{background:white;border:2px solid #e6eadc;border-radius:27px;padding:24px;box-shadow:0 7px 0 #e6eadc;margin-top:24px}.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{background:#edf3e7;border-radius:25px;padding:9px 15px;font-size:16px;font-weight:800}.settings{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{font:inherit}select{padding:9px;border:1px solid #c6d7bd;border-radius:12px;background:#fff;color:#345a48}label{font-size:14px}progress{width:100%;height:13px;accent-color:#6aa77e;margin:20px 0}.guide{text-align:center;color:#60796a;font-size:15px;margin:0 0 20px}.columns{display:grid;grid-template-columns:1fr 50px 1fr;gap:15px;max-width:620px;margin:auto}.column-title{text-align:center;font-size:16px;font-weight:800;margin:0 0 12px}.letters{display:grid;gap:12px}.letter{height:76px;font-family:system-ui,sans-serif;font-size:42px;font-weight:850;border:2px solid #c6d9ee;border-bottom-width:5px;background:#eef6ff;border-radius:18px;color:#2f5c85;cursor:pointer;touch-action:manipulation}.lower .letter{background:#fff5d5;border-color:#e6d293;color:#8a632b}.letter:hover:not(:disabled){transform:translateY(-2px)}.letter.selected{background:#eae2ff;border-color:#8a68bd;color:#6542a1}.letter.matched{background:#e3f4df;border-color:#97c48c;color:#4b7b40;opacity:1}.letter.matched:after{content:' ✓';font-size:20px}.letter.try{background:#ffede4;border-color:#deac91}.letter:disabled{cursor:default}.arrows{display:flex;flex-direction:column;justify-content:space-around;padding-top:28px;color:#b4c7ac;font-size:25px;text-align:center}.status{text-align:center;font-size:18px;font-weight:750;min-height:54px;margin:24px 0 8px}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.primary{background:#355e49;color:white;border:0;border-bottom:4px solid #234032;border-radius:14px;padding:12px 23px;font-size:18px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.4;cursor:default}.secondary{background:#fff;border:1px solid #bdd0b6;border-radius:14px;padding:10px 16px;color:#466b54;cursor:pointer}.result{text-align:center;padding:30px 12px}.result .big{font-size:70px}.result h2{font-size:30px}.result p{line-height:1.8;color:#697e6b}.hidden{display:none!important}footer{text-align:center;padding:27px 12px;color:#7e8b78;font-size:13px}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #9763bc;outline-offset:4px}@media(max-width:600px){header{padding:15px;align-items:flex-start}.brand{font-size:20px}nav{gap:8px;flex-direction:column}.playground{padding:17px 13px}.columns{grid-template-columns:1fr 28px 1fr;gap:10px}.letter{height:66px;font-size:35px}.hud{justify-content:center}.guide{font-size:14px}.column-title{font-size:14px}.status{font-size:16px}.pill{font-size:14px}main>p{font-size:15px}select{max-width:180px}}
@media(prefers-reduced-motion:no-preference){.matched{animation:pop .3s ease}@keyframes pop{50%{transform:scale(1.05)}}}
</style></head><body>
<header><div class="brand"><span>🔤</span> अक्षर दोस्त</div><nav><a href="./">गणित मस्ती</a><a href="car-game.html">कार गेम 🚗</a></nav></header>
<main><h1>ABCD की जोड़ी मिलाओ!</h1><p>बड़े अक्षर का छोटा दोस्त ढूँढ़ो।<br>जैसे <strong>A ↔ a</strong> और <strong>B ↔ b</strong> 🌼</p>
<section class="playground" aria-label="अक्षर मिलाने का खेल"><div class="hud"><span class="pill" id="round">राउंड 1 / 3</span><span class="pill" id="score">⭐ 0 जोड़ी</span><div class="settings"><label for="level">अक्षर चुनो</label><select id="level"><option value="ABCD">🌱 A से D</option><option value="ABCDEFGH">🌿 A से H</option><option value="ABCDEFGHIJKLMNOPQRSTUVWXYZ">🌳 पूरे A से Z</option></select></div></div><progress id="progress" max="12" value="0" aria-label="मिलाई गई जोड़ियाँ"></progress>
<div id="board"><p class="guide">पहले बड़ा अक्षर दबाओ, फिर उसका छोटा अक्षर चुनो।</p><div class="columns"><div><h2 class="column-title">बड़े अक्षर</h2><div class="letters upper" id="upper"></div></div><div class="arrows" aria-hidden="true"><span>↔</span><span>↔</span><span>↔</span><span>↔</span></div><div><h2 class="column-title">छोटे अक्षर</h2><div class="letters lower" id="lower"></div></div></div><div class="status" id="status" role="status" aria-live="polite">चलो, अक्षरों के दोस्त ढूँढ़ें! 🔍</div><div class="actions"><button class="primary" id="next" disabled>अगला राउंड →</button><button class="secondary" id="restart">फिर से शुरू करें ↻</button></div></div><div id="result" class="result hidden" aria-live="polite"></div></section></main><footer>💛 कोई जल्दी नहीं। गलत जोड़ी पर फिर कोशिश करो!</footer>
<script>
'use strict';const $=id=>document.getElementById(id);let round=0,total=0,pairs=0,selected=null,matched=new Set(),bag=[],current=[],previous=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function drawLetters(){let upper=shuffle(current),lower=shuffle(current);if(lower.join('')===upper.join(''))lower.push(lower.shift());$('upper').replaceChildren(...upper.map(ch=>letter(ch,false)));$('lower').replaceChildren(...lower.map(ch=>letter(ch,true)))}
function letter(ch,small){const b=document.createElement('button');b.className='letter';b.textContent=small?ch.toLowerCase():ch;b.dataset.letter=ch;b.setAttribute('aria-label',(small?'छोटा ':'बड़ा ')+b.textContent);b.setAttribute('aria-pressed','false');b.onclick=()=>small?match(ch,b):select(ch,b);return b}
function clearTries(){document.querySelectorAll('.letter.try').forEach(b=>b.classList.remove('try'))}
function select(ch,b){if(matched.has(ch))return;clearTries();selected=ch;document.querySelectorAll('#upper .letter').forEach(v=>{v.classList.remove('selected');v.setAttribute('aria-pressed','false')});b.classList.add('selected');b.setAttribute('aria-pressed','true');$('status').textContent=`${ch} का छोटा दोस्त ढूँढ़ो। 🔍`}
function match(ch,b){if(matched.has(ch))return;clearTries();if(!selected){$('status').textContent='पहले बाईं तरफ से एक बड़ा अक्षर चुनो। 👈';return}if(ch!==selected){b.classList.add('try');$('status').textContent='यह जोड़ी नहीं है। फिर से कोशिश करो! 🌼';return}matched.add(ch);selected=null;pairs++;total++;document.querySelectorAll('.letter').forEach(v=>{if(v.dataset.letter===ch){v.classList.remove('selected','try');v.classList.add('matched');v.disabled=true;v.setAttribute('aria-pressed','false')}});$('score').textContent=`⭐ ${total} जोड़ी`;$('progress').value=total;$('status').textContent=`शाबाश! ${ch} और ${ch.toLowerCase()} की जोड़ी मिल गई! ⭐`;if(pairs===4){$('next').disabled=false;$('next').textContent=round===2?'मेरे सितारे देखें 🏆':'अगला राउंड →';$('status').textContent='वाह! चारों जोड़ियाँ मिल गईं! 🎉'}}
function startRound(){pairs=0;matched=new Set();selected=null;$('next').disabled=true;$('round').textContent=`राउंड ${round+1} / 3`;$('next').textContent='अगला राउंड →';const pool=$('level').value;if(pool.length===4){current=[...pool]}else{current=[];while(current.length<4){if(!bag.length)bag=shuffle([...pool].filter(ch=>!current.includes(ch)));let ch=bag.pop();if(!current.includes(ch))current.push(ch)}}previous=[...current];drawLetters();$('status').textContent='चलो, नई जोड़ियाँ ढूँढ़ें! 🔍'}
function reset(){round=0;total=0;bag=[];$('score').textContent='⭐ 0 जोड़ी';$('progress').value=0;$('board').classList.remove('hidden');$('result').classList.add('hidden');startRound()}
$('next').onclick=()=>{if(pairs!==4)return;if(round<2){round++;startRound();$('upper').firstChild.focus()}else{$('board').classList.add('hidden');$('round').textContent='खेल पूरा!';$('result').classList.remove('hidden');$('result').replaceChildren();const trophy=document.createElement('div');trophy.className='big';trophy.textContent='🏆';const heading=document.createElement('h2');heading.textContent='तुम हो अक्षरों के उस्ताद!';const info=document.createElement('p');info.textContent='तुमने 12 जोड़ियाँ मिलाईं। बहुत खूब! ⭐';const again=document.createElement('button');again.className='primary';again.textContent='एक बार और खेलें ↻';again.onclick=reset;$('result').append(trophy,heading,info,again);again.focus()}};$('restart').onclick=reset;$('level').onchange=reset;reset();
</script></body></html>
